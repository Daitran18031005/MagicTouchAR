# Chạy thử trên máy:  cd Server && docker compose up --build
# Web: http://localhost:8000   API docs: http://localhost:8000/docs
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://magictouch:${POSTGRES_PASSWORD:-magictouch}@db:5432/magictouch
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      GAME_API_KEY: ${GAME_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magictouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magictouch}
      POSTGRES_DB: magictouch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magictouch"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
